 if(downloading)return;if(!boundary)return alert('Prima premi «Confine VEPAR» per acquisire il perimetro ufficiale. Senza confine non scarico zone approssimative.');
 if(!navigator.onLine)return alert('Serve Internet per scaricare le ortofoto.');
 if(!('caches' in window))return alert('Cache Storage non disponibile.');
 const allJobs=planJobs();
 const trial=!localStorage.getItem('hunting50-prova-'+document.getElementById('year').value);
 const jobs=trial?boundaryTiles(14).concat(boundaryTiles(15)):allJobs;
 if(jobs.length>220000)return alert('Richiesta di '+jobs.length+' immagini: troppo grande per un unico download Safari. Occorre suddividerla.');
 if(!confirm((trial?'Prima prova offline · zoom 14–15\n':'VEPAR + 200 m · zoom 14–19\n')+jobs.length+' immagini per anno.\nPuoi fermare e riprendere il download: le immagini già salvate verranno saltate. Mantieni l’app aperta e usa Wi-Fi. Verifica le condizioni DGU. Avviare?'))return;
 const ready=await swReady;if(!ready)return alert('Service worker non pronto.');
 downloading=true;cancelled=false;cancelBtn.hidden=false;offlineBtn.disabled=true;document.getElementById("year").disabled=true;document.getElementById('boundary').disabled=true;
 let ok=0,already=0,errors=0;
 try{const cache=await caches.open('hunting50-ortofoto-v1');for(let k=0;k<jobs.length;k++){
  if(cancelled||!navigator.onLine){cancelled=true;break;}const url=layer.getTileUrl(jobs[k]);try{if(await cache.match(url)){already++}else{const r=await fetch(new Request(url,{mode:'no-cors',credentials:'omit'}));if(r.ok||r.type==='opaque'){await cache.put(url,r.clone());ok++}else errors++}}catch(e){errors++;if(e.name==='QuotaExceededError'){cancelled=true;setStatus('Spazio cache esaurito');break;}}
  if(k%10===0||k===jobs.length-1)setStatus('VEPAR: '+(k+1)+'/'+jobs.length+' · nuove '+ok+' · già presenti '+already+' · errori '+errors);
  if(k%30===0)await new Promise(r=>setTimeout(r,350));
 }
 if(!cancelled&&errors===0&&ok+already===jobs.length){if(trial)localStorage.setItem('hunting50-prova-'+document.getElementById('year').value,'1');offlineNativeZoom=trial?15:19;localStorage.setItem(nativeZoomKey,String(offlineNativeZoom));layer.options.maxNativeZoom=offlineNativeZoom;layer.redraw()}
 setStatus((cancelled?'Interrotto':'Terminato')+' · nuove '+ok+' · già presenti '+already+' · errori '+errors);
 alert('Download '+(cancelled?'interrotto':'terminato')+'. '+ok+' nuove, '+already+' già salvate, '+errors+' errori. Le risposte WMS opache non permettono di verificare che siano fotografie valide: controlla offline in modalità aereo.');
 }catch(e){alert('Download interrotto: '+e.message)}finally{downloading=false;cancelBtn.hidden=true;offlineBtn.disabled=false;document.getElementById("year").disabled=false;document.getElementById('boundary').disabled=false}
};


</script></body></html>
