<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183e31"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Hunting 18 – Ortofoto GPS</title><style>html,body{margin:0;height:100%;font:15px system-ui}#map{height:100dvh;background:#dce4dd}.top{position:absolute;z-index:1000;top:10px;left:10px;right:10px;background:#fff;padding:9px;border-radius:12px;box-shadow:0 2px 12px #0003;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.bottom{position:absolute;z-index:1000;bottom:20px;left:10px;right:10px;display:flex;gap:8px}.bottom button{flex:1;padding:15px 4px;font-weight:700}.top button,.top select{padding:8px;border-radius:7px;border:1px solid #bbb;background:white}button.active{background:#216b4c;color:white}.small{font-size:11px;color:#444;flex-basis:100%}.leaflet-control-attribution{font-size:10px!important}</style></head><body><div id="map"></div><div class="top"><b>Hunting 18</b><select id="year"><option value="2024">DGU 2024</option><option value="2025_2026">DGU 2025/26</option></select><button id="gps">◎ GPS</button><button id="export">Esporta</button><button id="import">Importa</button><input type="file" id="file" accept="application/json" hidden><span id="status" class="small">Mappa DGU online · punti salvati sul dispositivo</span></div><div class="bottom"><button id="stand">＋ Altana</button><button id="park">＋ Parcheggio</button><button id="stop">Annulla</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const center=[45.38,13.82], key='hunting18-punti';let mode=null,points=[];try{points=JSON.parse(localStorage.getItem(key)||'[]')}catch{};const map=L.map('map',{zoomControl:false}).setView(center,15);L.control.zoom({position:'bottomright'}).addTo(map);let layer;
function setLayer(y){if(layer)map.removeLayer(layer);layer=L.tileLayer.wms('https://geoportal.dgu.hr/services/inspire/orthophoto_'+y+'/wms',{layers:'OI.OrthoimageCoverage',format:'image/jpeg',transparent:false,version:'1.3.0',maxZoom:21,attribution:'Ortofoto © DGU Croazia'}).addTo(map);document.getElementById('status').textContent='DGU '+y.replace('_','/')+' · immagini online; punti locali';layer.on('tileerror',()=>{document.getElementById('status').textContent='Immagini non disponibili: provare l’altro anno (livello WMS da verificare)'})}setLayer('2024');document.getElementById('year').onchange=e=>setLayer(e.target.value);
const group=L.layerGroup().addTo(map);function render(){group.clearLayers();points.forEach((p,i)=>L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div style="background:${p.type==='Altana'?'#b34d2e':'#2463b6'};border:2px solid white;color:white;border-radius:18px;padding:6px;white-space:nowrap;box-shadow:0 1px 5px #0008">${p.type==='Altana'?'▲':'P'} ${p.name.replaceAll('<','&lt;')}</div>`,iconSize:[110,35],iconAnchor:[50,35]})}).bindPopup(`<b>${p.type}: ${p.name.replaceAll('<','&lt;')}</b><br>${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}<br><button onclick="removePoint(${i})">Elimina</button>`).addTo(group))}window.removePoint=i=>{if(confirm('Eliminare il punto?')){points.splice(i,1);save()}};function save(){localStorage.setItem(key,JSON.stringify(points));render()}render();function select(m){mode=m;document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));if(m)document.getElementById(m==='Altana'?'stand':'park').classList.add('active');document.getElementById('status').textContent=m?'Tocca la mappa per aggiungere '+m:'Punti salvati sul dispositivo'}document.getElementById('stand').onclick=()=>select('Altana');document.getElementById('park').onclick=()=>select('Parcheggio');document.getElementById('stop').onclick=()=>select(null);map.on('click',e=>{if(!mode)return;let name=prompt('Nome '+mode,mode+' '+(points.length+1));if(name){points.push({type:mode,name,lat:e.latlng.lat,lng:e.latlng.lng});save()}select(null)});document.getElementById('gps').onclick=()=>{if(!navigator.geolocation)return alert('GPS non disponibile');navigator.geolocation.getCurrentPosition(p=>{let a=[p.coords.latitude,p.coords.longitude];L.circleMarker(a,{radius:9,color:'#0b8aef',fillOpacity:.8}).addTo(map).bindPopup('La tua posizione').openPopup();map.setView(a,17)},e=>alert('GPS: '+e.message),{enableHighAccuracy:true,timeout:15000})};document.getElementById('export').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({version:18,points},null,2)],{type:'application/json'}));a.href=url;a.download='hunting18-punti-privati.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(d)?d:d.points;if(!Array.isArray(arr))throw Error();let clean=arr.filter(p=>Number.isFinite(+p.lat)&&Number.isFinite(+p.lng)&&['Altana','Parcheggio'].includes(p.type)).map(p=>({type:p.type,name:String(p.name||p.type),lat:+p.lat,lng:+p.lng}));if(confirm('Importare '+clean.length+' punti, sostituendo quelli attuali?')){points=clean;save()}}catch{alert('File JSON non valido')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
